name: Run simulation
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m venv .venv
      - run: . .venv/bin/activate && pip install -r requirements.txt
      - run: . .venv/bin/activate && PYTHONPATH=src python -m Food_metabolism.scripts.run_scenario --plot
      - uses: actions/upload-artifact@v4
        with:
          name: sim-output
          path: |
            out/sim_output.csv
            out/plots
